[package]
name = "kds-e2e"
version = "0.1.0"
edition = "2021"

[dependencies]
shared-types = { path = "../../crates/shared-types" }
core-domain = { path = "../../crates/core-domain" }
infra = { path = "../../crates/infra" }
api-server = { path = "../../crates/api-server" }
scan-worker = { path = "../../crates/scan-worker" }

tokio = { version = "1.54.1", features = ["full"] }
axum = { version = "0.7.9", features = ["ws"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.11", features = ["cors", "trace"] }
http = "1.5.0"
http-body-util = "0.1.5"
bytes = "1.12.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.29.0", features = ["v4", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }
jsonwebtoken = "9.3.1"
sha2 = "0.10.9"
regex = "1.13.1"
async-trait = "0.1.92"
anyhow = "1.0.104"

[[test]]
name = "e2e"
path = "main.rs"
